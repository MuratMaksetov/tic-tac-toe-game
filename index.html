<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: white;
    }

    .game {
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 30px 24px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      width: min(90vw, 420px);
    }

    h1 {
      margin-bottom: 16px;
      font-size: 2rem;
    }

    .status {
      font-size: 1.1rem;
      min-height: 30px;
      margin-bottom: 20px;
      color: #d1fae5;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 12px;
      background: #374151;
      color: white;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cell:hover {
      background: #4b5563;
      transform: translateY(-1px);
    }

    .cell:disabled {
      cursor: not-allowed;
      opacity: 0.95;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button.reset {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.reset:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Tic Tac Toe</h1>
    <div id="status" class="status">Player X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="controls">
      <button class="reset" id="resetBtn">Reset Game</button>
    </div>
  </div>

  <script>
    const cells = Array.from(document.querySelectorAll('.cell'));
    const statusText = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameActive = true;

    const winPatterns = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function checkWinner() {
      for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line: pattern };
        }
      }
      return null;
    }

    function handleCellClick(event) {
      const cell = event.target;
      const index = Number(cell.dataset.index);

      if (board[index] || !gameActive) {
        return;
      }

      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.disabled = true;

      const winnerData = checkWinner();
      if (winnerData) {
        updateStatus(`Player ${currentPlayer} wins!`);
        gameActive = false;
        return;
      }

      if (board.every(cellValue => cellValue !== '')) {
        updateStatus("It's a draw!");
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus(`Player ${currentPlayer}'s turn`);
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameActive = true;

      cells.forEach(cell => {
        cell.textContent = '';
        cell.disabled = false;
      });

      updateStatus("Player X's turn");
    }

    cells.forEach(cell => {
      cell.addEventListener('click', handleCellClick);
    });

    resetBtn.addEventListener('click', resetGame);
  </script>
</body>
</html>
